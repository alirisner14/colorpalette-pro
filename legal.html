<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Legal · Color Palette PRO</title>
  <meta name="theme-color" content="#1E40AF">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="src/css/fonts.css">
  <link rel="stylesheet" href="src/css/styles.css">
  <style>
    .legal-wrap { max-width: 860px; margin: 0 auto; padding: 8px 16px 40px; }
    .doc-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px; }
    .doc-nav a { text-decoration: none; color: var(--ink-soft); font-weight: 800; font-size: .84rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--glass-border); background: var(--glass-inset); }
    .doc-nav a[aria-current] { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }
    .doc { border-radius: 28px; padding: clamp(18px, 4vw, 40px); line-height: 1.6; }
    .doc h1 { font-family: var(--display); font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 6px; }
    .doc h2 { margin: 1.8em 0 .4em; font-size: 1.25rem; }
    .doc h3 { margin: 1.4em 0 .3em; font-size: 1.05rem; }
    .doc a { color: var(--accent); font-weight: 700; }
    .doc code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; background: var(--glass-inset); padding: 1px 6px; border-radius: 6px; }
    .doc pre { background: var(--glass-inset); padding: 12px 14px; border-radius: 14px; overflow: auto; }
    .doc pre code { background: none; padding: 0; }
    .doc blockquote { margin: 1em 0; padding: 4px 16px; border-left: 4px solid var(--accent); background: var(--glass-inset); border-radius: 0 14px 14px 0; }
    .doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
    .doc .table { overflow-x: auto; }
    .doc table { border-collapse: collapse; width: 100%; font-size: .92rem; }
    .doc th, .doc td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .doc li.task { list-style: none; margin-left: -1.2em; }
    .back { display: inline-flex; margin-bottom: 10px; }
    @media (prefers-color-scheme: dark) { .doc a { color: color-mix(in srgb, var(--accent) 55%, white); } }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Back to Color Palette PRO">
      <img src="assets/logo.png" alt="" width="40" height="40">
      <span class="brand-name">Color Palette <b>PRO</b></span>
    </a>
    <a class="btn btn-glass" href="./">← Back to the app</a>
  </header>
  <main class="legal-wrap">
    <nav class="doc-nav" id="doc-nav" aria-label="Documents"></nav>
    <article class="doc glass" id="doc"><p>Loading…</p></article>
  </main>
  <footer class="app-footer">
    <span>© 2026 On the Rise Digital</span>
    <a href="mailto:ontherisedigital@gmail.com">ontherisedigital@gmail.com</a>
  </footer>
  <script type="module" src="src/js/legal.js"></script>
</body>
</html>
